# 打一个 macOS arm64 预览包用于验收，只上传 workflow artifact，不创建 Release。
# 推送到 preview/** 分支即触发（workflow_dispatch 要求文件在默认分支上才能用）。
name: Preview Build (macOS)

on:
  push:
    branches:
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHANNEL: oss

jobs:
  preview_macos:
    name: Build preview (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-aarch64
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure rust target is installed
        run: rustup target add aarch64-apple-darwin
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build bundle (ad-hoc signed)
        id: bundle_app
        run: script/bundle --channel "$CHANNEL" --arch aarch64 --dmg-name-suffix arm64 --selfsign
        shell: bash
        env:
          ZAP_CARGO_PROFILE: release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-preview-macos-arm64
          path: ${{ steps.bundle_app.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 7
